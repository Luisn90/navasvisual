:root {

.stage {

  height: clamp(520px, calc(100svh - 100px), 980px);
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--bg-soft);
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.stage.dragging { cursor: grabbing; }
.stage::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to right, var(--bg-soft), transparent 12%, transparent 88%, var(--bg-soft)),
    linear-gradient(to bottom, var(--bg-soft), transparent 14%, transparent 86%, var(--bg-soft));
}
.scene { position: absolute; inset: 0; perspective: 2000px; perspective-origin: 50% 38%; }
.wall {
  --tw: 200px; --gap: 24px; --cols: 7;
  --s: 0.8; --px: 0px; --py: 0px;
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--cols) * var(--tw) + (var(--cols) - 1) * var(--gap));
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--tw));
  gap: var(--gap);
  transform-style: preserve-3d;
  transform: translate(-50%, -50%) scale(var(--s)) rotateX(38deg) rotateZ(-22deg) translate(var(--px), var(--py));
}
.tile {
  position: relative; display: block; width: 100%; aspect-ratio: 4 / 5;
  border-radius: var(--radius-sm); overflow: hidden; cursor: pointer;
  background: var(--bg);
  box-shadow: 0 16px 28px -14px rgba(10,10,10,0.30);
  transform: translateZ(0);
  transition: transform 0.45s var(--easing-out), box-shadow 0.45s var(--easing-out);
  animation: rise 0.8s var(--easing-out) backwards;
  animation-delay: calc(var(--i) * 14ms);
}
.tile:hover, .tile:focus-visible { transform: translateZ(38px); box-shadow: 0 30px 40px -16px rgba(10,10,10,0.34); }
.tile img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.tile .ph, .vph { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: space-between; padding: 14px; text-align: left; background: var(--bg); }
.tile.nofoto .ph { display: flex; }

.ph b { font-weight: 500; font-size: 20px; line-height: 1.05; letter-spacing: -0.03em; }

@keyframes rise { from { opacity: 0.2; transform: translateZ(-80px); } to { opacity: 1; transform: translateZ(0); } }

.vwrap img { width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s; }

.nv-btn { padding: 14px 22px; border-radius: 999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.5s var(--easing); border: 1px solid transparent; white-space: nowrap; min-height: 44px; }
.nv-btn--primary { background: var(--fg); color: var(--bg); }
.nv-btn--primary:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.18); }

.visit { align-self: flex-start; }
.pager { margin-top: auto; display: flex; align-items: center; gap: 10px; }

.pager .nv-btn[disabled] { opacity: 0.35; cursor: default; pointer-events: none; }
.count { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--fg-muted); }

  var COLS = 7, ROT_X = 38, ROT_Z = -22;

  // Lista plana de piezas
  var items = [];

    p.i.forEach(function (f, k) { items.push({ p: p, pi: pi, k: k, src: B + f }); });
  });

  // Orden mezclado con semilla fija, evitando vecinos del mismo proyecto
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(20261105);

  for (var a = order.length - 1; a > 0; a--) { var b = Math.floor(rand() * (a + 1)); var tmp = order[a]; order[a] = order[b]; order[b] = tmp; }
  for (var pass = 0; pass < 6; pass++) {
    for (var n = 0; n < order.length; n++) {
      var left = n % COLS ? order[n - 1] : null, up = n >= COLS ? order[n - COLS] : null;
      if ((left && left.pi === order[n].pi) || (up && up.pi === order[n].pi)) {
        var m = Math.floor(rand() * order.length);
        var t2 = order[n]; order[n] = order[m]; order[m] = t2;
      }
    }
  }
  var center = Math.floor(order.length / 2);
  for (var q = 0; q < order.length; q++) {
    if (order[q].k === 0 && order[q].pi === 0) { var t3 = order[center]; order[center] = order[q]; order[q] = t3; break; }
  }

  var $ = function (id) { return document.getElementById(id); };
  var wall = $('wall'), stage = $('trabajos'), viewer = $('viewer'), vwrap = $('vwrap'), vimg = $('vimg'), vstage = $('vstage');
  var tiles = [];

  order.forEach(function (it, n) {
    it.n = n;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    btn.style.setProperty('--i', n);
    btn.setAttribute('aria-label', it.p.t + ', ' + it.p.c);
    var img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.src = it.src;
    img.addEventListener('error', function () { btn.classList.add('nofoto'); it.broken = true; });
    var ph = document.createElement('div');
    ph.className = 'ph';
    var s = document.createElement('small'); s.textContent = it.p.c;
    var bb = document.createElement('b'); bb.textContent = it.p.t;
    ph.appendChild(s); ph.appendChild(bb);
    btn.appendChild(img); btn.appendChild(ph);
    btn.addEventListener('click', function () { if (!dragged) openAt(n); });
    wall.appendChild(btn);
    tiles.push(btn);
    it.tile = btn; it.img = img;

  // Escala y movimiento del muro
  var sc = 0.8, px = 0, py = 0, dragged = false, drag = null;
  var th = ROT_Z * Math.PI / 180, cosX = Math.cos(ROT_X * Math.PI / 180);
  function clamp(v, lim) { return Math.max(-lim, Math.min(lim, v)); }

    sc = Math.max(0.42, Math.min(0.8, w / 1700));

  function applyPan() { wall.style.setProperty('--px', px + 'px'); wall.style.setProperty('--py', py + 'px'); }
  fit(); applyPan();

  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;

  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  // Visor
  var cur = -1, busy = false, hiddenTile = null;
  var group = [];

  function groupOf(it) {
    return items.filter(function (x) { return x.pi === it.pi; }).sort(function (a, b) { return a.k - b.k; });
  }
  function boxFor(it) {
    var ar = 0.8;
    if (it.img && it.img.naturalWidth) ar = it.img.naturalWidth / it.img.naturalHeight;

    vwrap.style.height = Math.round(h) + 'px';

  function fill(it) {
    var p = it.p;
    group = groupOf(it);
    var idx = group.indexOf(it);
    $('vcat').textContent = p.c;
    $('vtitle').textContent = p.t;
    var meta = [p.cl, p.y].filter(Boolean).join(' · ');

    var v = $('vvisit');
    if (p.u) { v.href = p.u; v.hidden = false; } else { v.hidden = true; }
    $('count').textContent = (idx + 1) + ' / ' + group.length;
    $('prev').disabled = idx === 0;
    $('next').disabled = idx === group.length - 1;
    $('vphcat').textContent = p.c;
    $('vphtitle').textContent = p.t;
    vwrap.classList.toggle('nofoto', !!it.broken);
    vimg.alt = p.t + ' (' + (idx + 1) + ' de ' + group.length + ')';
    vimg.src = it.src;
    boxFor(it);
  }
  function setHidden(it) {
    if (hiddenTile) hiddenTile.style.visibility = '';
    hiddenTile = it ? it.tile : null;
    if (hiddenTile) hiddenTile.style.visibility = 'hidden';
  }
  function flightFrom(it) {
    var r = it.tile.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;

  function openAt(n) {
    if (busy) return;

    var an = vwrap.animate([{ transform: from }, { transform: 'none' }], { duration: dur, easing: EASE });
    an.finished.then(function () { busy = false; }, function () { busy = false; });
    $('close').focus({ preventScroll: true });
  }

  function closeViewer() {
    if (busy || cur < 0) return;
    busy = true;
    var it = order[cur];
    var from = flightFrom(it);
    var dur = reduce ? 0 : 420;
    viewer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 0 : 380, easing: 'ease-in', fill: 'forwards' });
    var an = vwrap.animate([{ transform: 'none' }, { transform: from }], { duration: dur, easing: EASE, fill: 'forwards' });

      viewer.hidden = true;
      setHidden(null);
      document.body.classList.remove('locked');
      busy = false;
      var tl = it.tile; cur = -1;
      if (tl) tl.focus({ preventScroll: true });
    };
    an.finished.then(done, done);
  }

  function step(d) {
    if (busy || cur < 0) return;
    var it = order[cur];
    var idx = group.indexOf(it) + d;
    if (idx < 0 || idx >= group.length) return;
    var next = group[idx];
    cur = next.n;
    setHidden(next);
    vwrap.classList.add('swap');
    setTimeout(function () { fill(next); vwrap.classList.remove('swap'); }, reduce ? 0 : 180);
  }

  $('close').addEventListener('click', closeViewer);
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  vstage.addEventListener('click', function (e) { if (e.target === vstage) closeViewer(); });
  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    if (e.key === 'Escape') closeViewer();
