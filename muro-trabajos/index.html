<style>
/* Layout: encabezado compacto, un muro de piezas inclinado en 3D como protagonista, y el trabajo elegido que vuela al centro y se endereza. */
:root {
  --bg: #ECEDEE;
  --surface: #F8F8F9;
  --fg: #101113;
  --muted: #595D64;
  --line: #D2D4D8;
  --accent: #D92B14;
  --tile: #DCDEE2;
  --scrim: rgba(236, 237, 238, 0.92);
  --shadow: rgba(16, 17, 19, 0.30);
  --font-display: 'Elms Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0E10;
    --surface: #17181B;
    --fg: #EEEFF1;
    --muted: #9B9FA7;
    --line: #2A2C31;
    --accent: #FF5A43;
    --tile: #1E2024;
    --scrim: rgba(13, 14, 16, 0.93);
    --shadow: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0E10;
  --surface: #17181B;
  --fg: #EEEFF1;
  --muted: #9B9FA7;
  --line: #2A2C31;
  --accent: #FF5A43;
  --tile: #1E2024;
  --scrim: rgba(13, 14, 16, 0.93);
  --shadow: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}

html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.bar, .intro, .foot { max-width: 1280px; margin-left: auto; margin-right: auto; }

.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-block: 20px 0; flex-wrap: wrap; }
.mark { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
.mark span { color: var(--accent); }
.bar nav { display: flex; gap: 20px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.bar nav a { text-decoration: none; color: var(--muted); }
.bar nav a:hover { color: var(--fg); }

.intro { padding-block: 44px 28px; display: grid; gap: 18px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { margin: 0; font-weight: 750; font-size: clamp(34px, 6.4vw, 78px); line-height: 0.98; letter-spacing: -0.03em; max-width: 15ch; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 52ch; font-size: 17px; }
.hints { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.hints span::before { content: ''; display: inline-block; width: 7px; height: 7px; background: var(--accent); margin-right: 8px; transform: translateY(-1px); }

/* Muro */
.stage {
  position: relative;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  margin-top: 20px;
  height: clamp(520px, calc(100svh - 76px), 980px);
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.stage.dragging { cursor: grabbing; }
.stage::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to right, var(--bg), transparent 14%, transparent 86%, var(--bg)),
    linear-gradient(to bottom, var(--bg), transparent 16%, transparent 84%, var(--bg));
}
.scene { position: absolute; inset: 0; perspective: 2000px; perspective-origin: 50% 38%; }
.wall {
  --tw: 200px; --gap: 24px; --cols: 7;
  --s: 0.8; --px: 0px; --py: 0px;
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--cols) * var(--tw) + (var(--cols) - 1) * var(--gap));
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--tw));
  gap: var(--gap);
  transform-style: preserve-3d;
  transform: translate(-50%, -50%) scale(var(--s)) rotateX(38deg) rotateZ(-22deg) translate(var(--px), var(--py));
}
.tile {
  position: relative; display: block; width: 100%; aspect-ratio: 4 / 5;
  padding: 0; border: 0; border-radius: 2px; overflow: hidden; cursor: pointer;
  background: var(--tile);
  box-shadow: 0 16px 28px -14px var(--shadow);
  transform: translateZ(0);
  transition: transform 0.35s cubic-bezier(.2, .8, .2, 1), box-shadow 0.35s;
  animation: rise 0.7s cubic-bezier(.2, .8, .2, 1) backwards;
  animation-delay: calc(var(--i) * 14ms);
}
.tile:hover, .tile:focus-visible { transform: translateZ(38px); box-shadow: 0 30px 40px -16px var(--shadow); }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.tile .ph, .vph {
  position: absolute; inset: 0; display: none; flex-direction: column; justify-content: space-between;
  padding: 14px; text-align: left; background: var(--tile);
}
.tile.nofoto .ph { display: flex; }
.tile.nofoto img { display: none; }
.ph b { font-weight: 700; font-size: 20px; line-height: 1.05; letter-spacing: -0.02em; }
.ph small, .vph small { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
@keyframes rise { from { opacity: 0.2; transform: translateZ(-80px); } to { opacity: 1; transform: translateZ(0); } }

/* Visor */
.viewer { position: fixed; inset: 0; z-index: 50; display: flex; background: var(--scrim); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.viewer[hidden] { display: none; }
.vstage { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 28px; }
.vwrap { position: relative; flex: none; background: var(--tile); box-shadow: 0 40px 70px -30px var(--shadow); will-change: transform; }
.vwrap img { display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s; }
.vwrap.swap img { opacity: 0; }
.vph { background: var(--tile); }
.vwrap.nofoto .vph { display: flex; }
.vwrap.nofoto img { display: none; }
.vph b { font-weight: 700; font-size: clamp(22px, 4vw, 40px); line-height: 1.02; letter-spacing: -0.02em; }
.panel {
  width: 360px; flex: none; background: var(--surface); border-left: 1px solid var(--line);
  padding: 32px 28px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  padding-right: max(28px, env(safe-area-inset-right, 0px));
  padding-top: max(32px, env(safe-area-inset-top, 0px));
}
.panel .cat { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0; }
.panel h2 { margin: 0; font-weight: 750; font-size: 32px; line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance; }
.panel .meta { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.panel .desc { margin: 0; color: var(--muted); font-size: 15px; }
.panel .visit { align-self: flex-start; font-weight: 600; text-underline-offset: 4px; }
.pager { margin-top: auto; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; }
.btn { border: 1px solid var(--line); background: transparent; padding: 9px 14px; cursor: pointer; border-radius: 2px; min-width: 44px; min-height: 44px; }
.btn:hover { border-color: var(--fg); }
.btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pager .count { flex: 1; text-align: center; color: var(--muted); }
.pager .btn[disabled] { opacity: 0.35; cursor: default; }

.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; padding-block: 14px 18px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.foot a { text-decoration: none; }
.foot a:hover { color: var(--fg); }
.foot .mail { display: inline-flex; align-items: center; gap: 10px; }
.foot code { font: inherit; user-select: all; -webkit-user-select: all; }
.foot .copy { border: 0; background: none; padding: 4px 0; cursor: pointer; font: inherit; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 820px) {
  .viewer { flex-direction: column; }
  .vstage { padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); }
  .panel { width: auto; border-left: 0; border-top: 1px solid var(--line); padding: 18px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); max-height: 46%; gap: 10px; }
  .panel h2 { font-size: 24px; }
  .intro { padding-block: 32px 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .tile { animation: none; transition: none; }
  .vwrap img { transition: none; }
}
</style>

    var cs = getComputedStyle(vstage);
    var aw = vstage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var ah = vstage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var w = Math.min(aw, ah * ar), h = w / ar;
    vwrap.style.width = Math.round(w) + 'px';
    vwrap.style.height = Math.round(h) + 'px';
  }
  function fill(it) {
    var p = it.p;
    group = groupOf(it);
    var idx = group.indexOf(it);
    $('vcat').textContent = p.c;
    $('vtitle').textContent = p.t;
    var meta = [p.cl, p.y].filter(Boolean).join(' · ');
    $('vmeta').textContent = meta; $('vmeta').hidden = !meta;
    $('vdesc').textContent = p.d; $('vdesc').hidden = !p.d;
    var v = $('vvisit');
    if (p.u) { v.href = p.u; v.hidden = false; } else { v.hidden = true; }
    $('count').textContent = (idx + 1) + ' / ' + group.length;
    $('prev').disabled = idx === 0;
    $('next').disabled = idx === group.length - 1;
    $('vphcat').textContent = p.c;
    $('vphtitle').textContent = p.t;
    vwrap.classList.toggle('nofoto', !!it.broken);
    vimg.alt = p.t + ' (' + (idx + 1) + ' de ' + group.length + ')';
    vimg.src = it.src;
    boxFor(it);
  }
  function setHidden(it) {
    if (hiddenTile) hiddenTile.style.visibility = '';
    hiddenTile = it ? it.tile : null;
    if (hiddenTile) hiddenTile.style.visibility = 'hidden';
  }
  function flightFrom(it) {
    var r = it.tile.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var w = vwrap.getBoundingClientRect();
    var wx = w.left + w.width / 2, wy = w.top + w.height / 2;
    var k = (it.tile.offsetWidth * sc) / w.width;
    return 'translate(' + (cx - wx) + 'px,' + (cy - wy) + 'px) perspective(1400px) rotateX(' + ROT_X + 'deg) rotateZ(' + ROT_Z + 'deg) scale(' + k + ')';
  }
  var EASE = 'cubic-bezier(.2,.8,.2,1)';

  function openAt(n) {
    if (busy) return;
    var it = order[n];
    cur = n; busy = true;
    document.body.classList.add('locked');
    viewer.hidden = false;
    fill(it);
    var from = flightFrom(it);
    setHidden(it);
    var dur = reduce ? 0 : 560;
    viewer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduce ? 0 : 300, easing: 'ease-out' });
    $('panel').animate([{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: reduce ? 0 : 420, delay: reduce ? 0 : 220, easing: EASE, fill: 'backwards' });
    var an = vwrap.animate([{ transform: from }, { transform: 'none' }], { duration: dur, easing: EASE });
    an.finished.then(function () { busy = false; }, function () { busy = false; });
    $('close').focus({ preventScroll: true });
  }

  function closeViewer() {
    if (busy || cur < 0) return;
    busy = true;
    var it = order[cur];
    var from = flightFrom(it);
    var dur = reduce ? 0 : 420;
    viewer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 0 : 380, easing: 'ease-in', fill: 'forwards' });
    var an = vwrap.animate([{ transform: 'none' }, { transform: from }], { duration: dur, easing: EASE, fill: 'forwards' });
    var done = function () {
      viewer.getAnimations().forEach(function (x) { x.cancel(); });
      vwrap.getAnimations().forEach(function (x) { x.cancel(); });
      viewer.hidden = true;
      setHidden(null);
      document.body.classList.remove('locked');
      busy = false;
      var tl = it.tile; cur = -1;
      if (tl) tl.focus({ preventScroll: true });
    };
    an.finished.then(done, done);
  }

  function step(d) {
    if (busy || cur < 0) return;
    var it = order[cur];
    var idx = group.indexOf(it) + d;
    if (idx < 0 || idx >= group.length) return;
    var next = group[idx];
    cur = next.n;
    setHidden(next);
    vwrap.classList.add('swap');
    setTimeout(function () { fill(next); vwrap.classList.remove('swap'); }, reduce ? 0 : 180);
  }

  $('close').addEventListener('click', closeViewer);
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  vstage.addEventListener('click', function (e) { if (e.target === vstage) closeViewer(); });
  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
  window.addEventListener('resize', function () {
    fit();
    if (!viewer.hidden && cur >= 0) boxFor(order[cur]);
  });

  // Copiar correo
  $('copy').addEventListener('click', function () {
    var btn = this, txt = $('mail').textContent;
    var ok = function () { btn.textContent = 'Copiado'; setTimeout(function () { btn.textContent = 'Copiar'; }, 1600); };
    var fallback = function () {
      var r = document.createRange(); r.selectNodeContents($('mail'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = 'Seleccionado';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback);
    else fallback();
  });
})();
</script>
</body>
</html>
